version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Docker Compose LOCAL — Motor de IA + Redis
# ATENÇÃO: PostgreSQL e Redis rodam aqui apenas em DEV.
# Em produção, usar Cloud SQL + Memorystore (GCP).
# ─────────────────────────────────────────────────────────────────────────────

services:

  motor-ia:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: motor-ia
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=development
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CORE_API_URL=http://host.docker.internal:3000
      - CORE_API_KEY=${CORE_API_KEY:-dev-api-key}
      - PORT=8080
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - fintech-net
    volumes:
      - ./app:/app/app  # Hot reload em dev

  redis:
    image: redis:7.2-alpine
    container_name: fintech-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - fintech-net
    volumes:
      - redis_data:/data

networks:
  fintech-net:
    driver: bridge

volumes:
  redis_data:
