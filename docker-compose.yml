# docker-compose.yml - sobe o ambiente completo de desenvolvimento.
#
# Uso recomendado para qualquer maquina:
#   docker compose up --build
#
# Para recriar o banco do zero:
#   docker compose down -v
#   docker compose up --build

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-financeiro}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-financeiro}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/financeiro}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_me}
      PORT: ${PORT:-3000}
      BRAPI_API_KEY: ${BRAPI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - backend_node_modules:/app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend/app:/app/app
      - ./frontend/public:/app/public
      - frontend_node_modules:/app/node_modules

  ia:
    build:
      context: ./ia
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./ia:/app

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:
