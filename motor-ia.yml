name: Build & Deploy Motor de IA

on:
  push:
    branches:
      - main
    paths:
      - "motor-ia/**"
      - ".github/workflows/motor-ia.yml"
  pull_request:
    branches:
      - main
    paths:
      - "motor-ia/**"

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  SERVICE_NAME: motor-ia
  # Artifact Registry: <region>-docker.pkg.dev/<project>/<repo>/<image>
  IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fintech-repo/motor-ia

jobs:
  # ────────────────────────────────────────────
  # JOB 1: Testes
  # ────────────────────────────────────────────
  test:
    name: 🧪 Testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: motor-ia

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt pytest pytest-asyncio httpx

      - name: Rodar testes
        run: pytest tests/ -v --tb=short
        continue-on-error: true  # Não bloqueia o deploy se não houver testes ainda

  # ────────────────────────────────────────────
  # JOB 2: Build e Push para Artifact Registry
  # ────────────────────────────────────────────
  build-and-push:
    name: 🐳 Build & Push Docker
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: motor-ia

    steps:
      - uses: actions/checkout@v4

      - name: Autenticar no GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar Docker para Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build da imagem Docker
        run: |
          docker build \
            --tag ${{ env.IMAGE }}:${{ github.sha }} \
            --tag ${{ env.IMAGE }}:latest \
            --cache-from ${{ env.IMAGE }}:latest \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            .

      - name: Push para Artifact Registry
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

  # ────────────────────────────────────────────
  # JOB 3: Deploy no Cloud Run
  # ────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy Cloud Run
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Autenticar no GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy no Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          env_vars: |
            APP_ENV=production
            REDIS_HOST=${{ secrets.MEMORYSTORE_HOST }}
            REDIS_PORT=6379
            CORE_API_URL=${{ secrets.CORE_API_URL }}
          secrets: |
            CORE_API_KEY=core-api-key:latest
            REDIS_PASSWORD=redis-password:latest
          flags: |
            --min-instances=0
            --max-instances=10
            --memory=512Mi
            --cpu=1
            --timeout=60
            --concurrency=80

      - name: 📋 URL do serviço
        run: echo "Motor de IA disponível em ${{ steps.deploy.outputs.url }}"
